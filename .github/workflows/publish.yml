name: Publish

# Publishes when a GitHub release is published. Configure npm trusted
# publishing for this repository and workflow before enabling releases.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: make ci
      - run: npm publish
